# Public example: the official Playwright TodoMVC demo site.
# Purpose: exercise the whole pipeline and serve as a reference.
# Run it with: python scripts/demorec.py run <this directory>

project: TodoMVC demo

viewport: [1920, 1080]
fps: 30
jpeg_quality: 86
locale: en-US

browser_channel: chrome

ready_timeout: 60
ready_settle: 1.0
ready_gone_text: ""

find_timeout: 9

voice:
  name: en-US-AndrewNeural
  rate: "+5%"

pacing:
  lead_in: 0.70
  gap: 0.35
  tail: 1.40

mask:
  boxes: []          # public site, nothing to mask
  color: "0xEEF2FA"
  hide_text: []

root_url: https://demo.playwright.dev/todomvc/

build:
  ffmpeg: auto
  crf: 18
  preset: medium
  audio_bitrate: 192k
  output_name: todomvc-demo.mp4

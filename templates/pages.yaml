# Pages and semantic element names.
#
# scenes.yaml only references the names (el), never the selectors, so a site
# redesign touches this file alone and the storyboard is untouched.
# A list is allowed: candidates are tried in order, which is a cheap fallback.

pages:
  home:
    url: index.html
    elements:
      primary_button:
        - 'button[type="submit"]'
        - 'button[class*="primary"]'
      search_input: 'input[placeholder*="Search"]'

# demorec project configuration — the file you edit per project.
# Every key has a default; start with project + root_url + one page.

project: <project name, used in logs and output>

# Recorded canvas. Changing this affects recording and the rendered file together;
# no script needs to change.
viewport: [1920, 1080]
fps: 30
jpeg_quality: 86
locale: en-US

# Leave empty to use Playwright's bundled Chromium; set "chrome" to use a local
# Chrome install, which looks slightly closer to a real session.
browser_channel: chrome

# Page-ready detection: keep waiting while the body text is shorter than a
# threshold, or while it still contains ready_gone_text. If the site has a
# branded loading animation, put its text in ready_gone_text.
ready_timeout: 110
ready_settle: 1.2
ready_gone_text: ""

find_timeout: 9

voice:
  name: en-US-AndrewNeural
  rate: "+5%"

pacing:
  lead_in: 0.80
  gap: 0.38
  tail: 1.60

mask:
  # [x, y, w, h] — probe with demorec.py probe, then confirm by eye.
  # The fill must be fully opaque; any alpha leaks the glyph outlines.
  boxes: []
  color: "0xEEF2FA"
  # Watermarks that move with scrolling: hide at runtime, do not use a fixed box.
  hide_text: []

root_url: https://example.com/app/

build:
  ffmpeg: auto
  crf: 17
  preset: medium
  audio_bitrate: 192k
  output_name: demo.mp4

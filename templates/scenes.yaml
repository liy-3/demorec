# Storyboard — pure YAML.
#
# say: N  = block until narration line N of this scene has finished (0-based).
#           Rewriting a line re-flows the scene rhythm automatically.
# This is what keeps a storyboard maintainable: never hard-code seconds that
# depend on speech.

scenes:
  - id: s1_intro
    title: Opening
    page: home
    narration:
      - First narration line.
      - Second narration line.
    steps:
      - goto: home
      - start
      - wait: 0.5
      - move: {el: primary_button, dur: 0.6}
      - say: 0
      - click: {el: primary_button, hover: 0.35, after: 2.0}
      - say: [1, 1.2]
      - stop

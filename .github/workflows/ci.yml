name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Only the pure-Python pieces are needed: the suite never launches a
      # browser or runs ffmpeg, so CI stays fast and dependency-light.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: Lint every bundled project
        shell: bash
        run: |
          python scripts/demorec.py lint examples/todomvc
          python scripts/demorec.py lint templates || true

      - name: Run the test suite
        run: python -m pytest tests/ -q

      - name: Byte-compile every script
        shell: bash
        run: python -m compileall -q scripts
